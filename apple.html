<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple 產品規格與價格</title>
  <style>
    :root {
      --ink: #f5f5f7;
      --muted: #a6a6ad;
      --bg: #090a0d;
      --panel: #15161a;
      --line: #2b2c31;
      --blue: #2997ff;
      --green: #7de2b1;
      --orange: #ff9f0a;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 85% 5%, rgba(41,151,255,.13), transparent 30%),
        radial-gradient(circle at 5% 55%, rgba(125,226,177,.08), transparent 26%);
    }
    .wrap { width: min(1160px, calc(100% - 40px)); margin: auto; }
    header { padding: 72px 0 44px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--blue); font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 720px; margin: 10px 0 16px; font-size: clamp(42px, 7vw, 76px); line-height: 1.05; letter-spacing: -.05em; }
    .intro { max-width: 640px; margin: 0; color: var(--muted); font-size: 17px; }
    .notice { margin-top: 26px; color: #d6d6da; font-size: 13px; }
    .notice strong { color: var(--orange); }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 30px 0 22px; }
    .tabs { display: inline-flex; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: #101114; }
    .tab { border: 0; border-radius: 8px; padding: 10px 22px; color: var(--muted); background: transparent; cursor: pointer; font: inherit; font-weight: 700; }
    .tab[aria-selected="true"] { color: #fff; background: #292a30; }
    .count { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding-bottom: 74px; }
    .card { display: flex; flex-direction: column; min-height: 510px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: rgba(21,22,26,.86); transition: transform .2s ease, border-color .2s ease; }
    .card:hover { transform: translateY(-5px); border-color: #606169; }
    .visual { display: grid; place-items: center; min-height: 190px; background: #101114; position: relative; overflow: hidden; }
    .visual::after { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: var(--glow, rgba(41,151,255,.16)); filter: blur(15px); }
    .phone { width: 82px; height: 145px; z-index: 1; border: 4px solid #777981; border-radius: 18px; background: linear-gradient(145deg, #303239, #111216); box-shadow: 0 14px 30px rgba(0,0,0,.5); position: relative; }
    .phone::before { content: ""; position: absolute; top: 7px; left: 50%; width: 27px; height: 8px; transform: translateX(-50%); border-radius: 8px; background: #050506; }
    .phone::after { content: ""; position: absolute; inset: 28px 9px 10px; border-radius: 9px; background: linear-gradient(145deg, #23364c, #0c1018 70%); }
    .laptop { width: 190px; height: 122px; z-index: 1; border: 4px solid #8d9097; border-bottom-width: 10px; border-radius: 8px 8px 3px 3px; background: linear-gradient(145deg, #32343a, #111216); transform: perspective(260px) rotateX(4deg); box-shadow: 0 17px 25px rgba(0,0,0,.5); }
    .laptop::after { content: ""; position: absolute; left: -24px; bottom: -19px; width: 230px; height: 8px; border-radius: 50%; background: #797c83; }
    .card-body { display: flex; flex: 1; flex-direction: column; padding: 23px; }
    .tag { display: inline-block; margin-bottom: 9px; color: var(--green); font-size: 12px; font-weight: 700; }
    h2 { margin: 0; font-size: 25px; letter-spacing: -.03em; }
    .price { margin: 5px 0 18px; color: #fff; font-size: 23px; font-weight: 800; }
    .price small { color: var(--muted); font-size: 12px; font-weight: 400; }
    dl { display: grid; grid-template-columns: 78px 1fr; gap: 8px 12px; margin: 0; padding-top: 17px; border-top: 1px solid var(--line); font-size: 14px; }
    dt { color: var(--muted); } dd { margin: 0; color: #e1e1e5; }
    .hidden { display: none; }
    footer { padding: 28px 0 50px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    @media (max-width: 840px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) {
      .wrap { width: min(100% - 28px, 480px); }
      header { padding-top: 44px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 0; }
      .visual { min-height: 165px; }
      .tabs { width: 100%; }
      .tab { flex: 1; padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="eyebrow">Apple product guide · 2026</div>
      <h1>把每台 Apple<br>放在一起比較。</h1>
      <p class="intro">iPhone 17 系列與 MacBook 系列的重點規格、建議起售價，一頁快速掌握。</p>
      <p class="notice"><strong>價格提醒</strong> 以下為台灣官方建議起售價參考，會因容量、記憶體、教育優惠與活動而變動；購買前請以 Apple 台灣官網為準。</p>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="產品分類">
        <button class="tab" role="tab" aria-selected="true" data-group="iphone">iPhone 17 系列</button>
        <button class="tab" role="tab" aria-selected="false" data-group="macbook">MacBook</button>
      </div>
      <span class="count" id="count">5 款產品</span>
    </div>

    <section class="grid" id="iphone" aria-label="iPhone 17 系列"></section>
    <section class="grid hidden" id="macbook" aria-label="MacBook 系列"></section>
  </main>

  <footer>
    <div class="wrap">資料為規格整理與價格參考，不代表 Apple Inc. 的官方頁面或即時庫存。</div>
  </footer>

  <script>
    const products = {
      iphone: [
        { name: 'iPhone 17e', tag: '輕巧入門', price: 'NT$ 24,900 起', display: '6.1 吋 OLED', chip: 'A19 晶片', camera: '48MP Fusion 主相機', battery: '最長 26 小時影片播放' },
        { name: 'iPhone 17', tag: '全能日常', price: 'NT$ 29,900 起', display: '6.3 吋 Super Retina XDR', chip: 'A19 晶片', camera: '48MP Fusion 雙相機', battery: '最長 30 小時影片播放' },
        { name: 'iPhone Air', tag: '超薄輕盈', price: 'NT$ 36,900 起', display: '6.5 吋 OLED，120Hz ProMotion', chip: 'A19 Pro 晶片', camera: '48MP Fusion 主相機', battery: '最長 27 小時影片播放' },
        { name: 'iPhone 17 Pro', tag: '專業影像', price: 'NT$ 39,900 起', display: '6.3 吋 OLED，120Hz ProMotion', chip: 'A19 Pro 晶片', camera: '48MP 三相機系統，8 倍光學品質變焦', battery: '最長 33 小時影片播放' },
        { name: 'iPhone 17 Pro Max', tag: '旗艦大滿配', price: 'NT$ 44,900 起', display: '6.9 吋 OLED，120Hz ProMotion', chip: 'A19 Pro 晶片', camera: '48MP 三相機系統，8 倍光學品質變焦', battery: '最長 39 小時影片播放' }
      ],
      macbook: [
        { name: 'MacBook Air 13 吋', tag: '日常首選', price: 'NT$ 34,900 起', display: '13.6 吋 Liquid Retina', chip: 'Apple M4 晶片，最高 32GB 記憶體', camera: '12MP Center Stage 相機', battery: '最長 18 小時電池續航力' },
        { name: 'MacBook Air 15 吋', tag: '大螢幕生產力', price: 'NT$ 44,900 起', display: '15.3 吋 Liquid Retina', chip: 'Apple M4 晶片，最高 32GB 記憶體', camera: '12MP Center Stage 相機', battery: '最長 18 小時電池續航力' },
        { name: 'MacBook Pro 14 吋', tag: '專業效能', price: 'NT$ 54,900 起', display: '14.2 吋 Liquid Retina XDR，120Hz', chip: 'Apple M5 晶片，最高 32GB 記憶體', camera: '12MP Center Stage 相機', battery: '最長 24 小時電池續航力' },
        { name: 'MacBook Pro 14 吋 Pro', tag: '創作者工作站', price: 'NT$ 74,900 起', display: '14.2 吋 Liquid Retina XDR，120Hz', chip: 'Apple M5 Pro，最高 64GB 記憶體', camera: '12MP Center Stage 相機', battery: '最長 22 小時電池續航力' },
        { name: 'MacBook Pro 16 吋 Max', tag: '極致效能', price: 'NT$ 104,900 起', display: '16.2 吋 Liquid Retina XDR，120Hz', chip: 'Apple M5 Max，最高 128GB 記憶體', camera: '12MP Center Stage 相機', battery: '最長 22 小時電池續航力' }
      ]
    };

    const labels = [['display', '顯示器'], ['chip', '晶片'], ['camera', '相機'], ['battery', '續航力']];
    const render = (group) => {
      const html = products[group].map((product, index) => `
        <article class="card">
          <div class="visual" style="--glow: ${index % 2 ? 'rgba(125,226,177,.14)' : 'rgba(41,151,255,.16)'}">
            <div class="${group === 'iphone' ? 'phone' : 'laptop'}" aria-hidden="true"></div>
          </div>
          <div class="card-body">
            <span class="tag">${product.tag}</span>
            <h2>${product.name}</h2>
            <div class="price">${product.price} <small>建議售價</small></div>
            <dl>${labels.map(([key, label]) => `<dt>${label}</dt><dd>${product[key]}</dd>`).join('')}</dl>
          </div>
        </article>`).join('');
      document.getElementById(group).innerHTML = html;
    };

    render('iphone');
    render('macbook');
    document.querySelectorAll('.tab').forEach((tab) => tab.addEventListener('click', () => {
      const group = tab.dataset.group;
      document.querySelectorAll('.tab').forEach((item) => item.setAttribute('aria-selected', item === tab));
      document.querySelectorAll('.grid').forEach((section) => section.classList.toggle('hidden', section.id !== group));
      document.getElementById('count').textContent = `${products[group].length} 款產品`;
    }));
  </script>
</body>
</html>
